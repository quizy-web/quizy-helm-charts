apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-logstash
  labels:
    app: logstash
spec:
  type: {{ .Values.service.type }}
  ports:
  {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: TCP
  {{- end }}
  selector:
    app: logstash
