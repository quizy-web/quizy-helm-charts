image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: 8.11.0
  pullPolicy: IfNotPresent

replicaCount: 1

persistence:
  enabled: true
  storageClass: "standard"
  size: 5Gi

config:
  clusterName: "elasticsearch-cluster"
  nodeGroup: "master"
  roles: "master,data,ingest"
  heapSize: "512m"

service:
  type: ClusterIP
  port: 9200
